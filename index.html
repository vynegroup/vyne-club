<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYNÉ CLUB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f4efe7;
      color: #241f1b;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 70px;
    }

    .welcome {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 8px;
      opacity: 0.65;
    }

    h1 {
      font-size: 42px;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 45px;
    }

    .stamp-number {
      font-size: 88px;
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -5px;
    }

    .stamp-label {
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 12px;
      opacity: 0.55;
    }

    .stamps {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-top: 28px;
      margin-bottom: 55px;
    }

    .stamp {
      width: 100%;
      aspect-ratio: 1;
      border: 1.5px solid #241f1b;
      border-radius: 50%;
    }

    .stamp.active {
      background: #241f1b;
    }

    .reward {
      border-top: 1px solid rgba(36, 31, 27, 0.25);
      padding-top: 22px;
      margin-bottom: 35px;
    }

    .reward-label {
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.55;
      margin-bottom: 8px;
    }

    .reward-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .reward-status {
      font-size: 13px;
      opacity: 0.6;
    }

    .qr-button {
      margin-top: auto;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 999px;
      background: #241f1b;
      color: #f4efe7;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.4;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">VYNÉ CLUB</div>

    <div class="welcome">
      Good things happen<br>
      when you come back.
    </div>

    <h1>ANWAR</h1>

    <div class="stamp-number">0</div>
    <div class="stamp-label">STAMPS</div>

    <div class="stamps">
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
      <div class="stamp"></div>
    </div>

    <section class="reward">
      <div class="reward-label">YOUR REWARD</div>
      <div class="reward-name">FREE COFFEE</div>
      <div class="reward-status">
        Collect 10 stamps to unlock
      </div>
    </section>

    <button class="qr-button">
      MY QR
    </button>

    <div class="footer">
      PINE HAUS · MIMOMI · COMPOUND
    </div>

  </main>

</body>
        </html>
