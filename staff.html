<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VYNÉ CLUB — STAFF</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

:root {
    --black: #080808;
    --cream: #f2eee5;
    --line: rgba(242, 238, 229, .35);
    --muted: rgba(242, 238, 229, .58);
    --danger: #ff8f8f;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--black);
}

body {
    color: var(--cream);
    font-family: "Space Mono", monospace;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 42px 30px 48px;
}


/* =====================================================
   COMMON
===================================================== */

.small-label {
    font-size: 10px;
    letter-spacing: .32em;
    color: var(--muted);
}

.status {
    min-height: 18px;
    margin-top: 16px;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: .08em;
    color: var(--muted);
}

.status.error {
    color: var(--danger);
}


/* =====================================================
   LOGIN
===================================================== */

.login-screen {
    min-height: calc(100vh - 90px);
    padding-top: 35px;
}

.login-title {
    margin-top: 48px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 76px;
    line-height: .88;
    letter-spacing: .01em;
}

.login-copy {
    margin-top: 42px;
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
}

.login-form {
    margin-top: 72px;
}

.login-form label {
    display: block;
    margin-bottom: 12px;
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--muted);
}

.login-form input {
    width: 100%;
    margin-bottom: 36px;
    padding: 14px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    color: var(--cream);
    font-size: 15px;
    outline: none;
}

.login-form input:focus {
    border-bottom-color: var(--cream);
}

.login-button {
    width: 100%;
    margin-top: 20px;
    padding: 20px;
    border: none;
    background: var(--cream);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .25em;
}

.login-button:disabled {
    opacity: .5;
}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard-screen {
    width: 100%;
}

.staff-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
}

.staff-name {
    margin-top: 8px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 34px;
    line-height: 1;
}

.logout-button {
    padding: 12px 14px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cream);
    font-size: 9px;
    letter-spacing: .2em;
}

.checkin {
    margin-top: 76px;
}

.checkin-title {
    font-family: "Bebas Neue", sans-serif;
    font-size: 72px;
    line-height: .86;
}

.checkin-copy {
    max-width: 320px;
    margin-top: 28px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.8;
}


/* =====================================================
   CAMERA
===================================================== */

.open-camera-button {
    width: 100%;
    margin-top: 38px;
    padding: 20px;
    border: none;
    background: var(--cream);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .24em;
}

.open-camera-button:disabled {
    opacity: .5;
}

.close-camera-button {
    width: 100%;
    margin-top: 12px;
    padding: 17px;
    border: 1px solid var(--cream);
    background: transparent;
    color: var(--cream);
    font-size: 10px;
    letter-spacing: .22em;
}

.camera-container {
    width: 100%;
    margin-top: 24px;
    padding: 8px;
    border: 1px solid var(--line);
    overflow: hidden;
}

#qrReader {
    width: 100%;
    overflow: hidden;
}

#qrReader video,
#qrReader canvas {
    width: 100% !important;
    max-width: 100% !important;
}


/* =====================================================
   MANUAL FALLBACK
===================================================== */

.manual-section {
    margin-top: 46px;
    padding-top: 30px;
    border-top: 1px solid var(--line);
}

.manual-label {
    font-size: 9px;
    line-height: 1.6;
    letter-spacing: .26em;
    color: var(--muted);
}

.qr-input {
    width: 100%;
    margin-top: 24px;
    padding: 14px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    color: var(--cream);
    outline: none;
}

.find-button {
    width: 100%;
    margin-top: 22px;
    padding: 18px;
    background: transparent;
    border: 1px solid var(--cream);
    color: var(--cream);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .22em;
}


/* =====================================================
   MEMBER RESULT
===================================================== */

.member-card {
    margin-top: 56px;
    padding-top: 34px;
    border-top: 1px solid var(--line);
}

.member-label {
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--muted);
}

.customer-name {
    margin-top: 16px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 64px;
    line-height: .9;
}

.customer-phone {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
}

.stamp-count {
    margin-top: 44px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 130px;
    line-height: .72;
}

.stamp-caption {
    margin-top: 28px;
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--muted);
}

.add-stamp-button {
    width: 100%;
    margin-top: 44px;
    padding: 21px;
    border: none;
    background: var(--cream);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .24em;
}

.add-stamp-button:disabled {
    opacity: .5;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 360px) {

    .app {
        padding-left: 22px;
        padding-right: 22px;
    }

    .login-title {
        font-size: 68px;
    }

    .checkin-title {
        font-size: 64px;
    }

}

</style>

</head>

<body>

<main class="app">


<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<section
    id="loginScreen"
    class="login-screen"
>

    <div class="small-label">
        VYNÉ CLUB / STAFF
    </div>

    <div class="login-title">
        STAFF<br>
        ACCESS.
    </div>

    <div class="login-copy">
        Authorized personnel only.<br>
        Very serious loyalty business.
    </div>

    <div class="login-form">

        <label for="emailInput">
            EMAIL
        </label>

        <input
            id="emailInput"
            type="email"
            autocomplete="email"
        >

        <label for="passwordInput">
            PASSWORD
        </label>

        <input
            id="passwordInput"
            type="password"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="login-button"
            type="button"
        >
            LOGIN
        </button>

        <div
            id="loginStatus"
            class="status"
        ></div>

    </div>

</section>



<!-- =====================================================
     DASHBOARD SCREEN
===================================================== -->

<section
    id="dashboardScreen"
    class="dashboard-screen hidden"
>

    <header class="staff-header">

        <div>

            <div class="small-label">
                VYNÉ CLUB / STAFF
            </div>

            <div
                id="staffName"
                class="staff-name"
            >
                STAFF
            </div>

        </div>

        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >
            LOGOUT
        </button>

    </header>


    <section class="checkin">

        <div class="checkin-title">
            MEMBER<br>
            CHECK-IN.
        </div>

        <div class="checkin-copy">
            Open camera and scan the member's Vyné QR.
        </div>


        <button
            id="openCameraButton"
            class="open-camera-button"
            type="button"
        >
            OPEN CAMERA
        </button>


        <button
            id="closeCameraButton"
            class="close-camera-button hidden"
            type="button"
        >
            CLOSE CAMERA
        </button>


        <div
            id="cameraContainer"
            class="camera-container hidden"
        >
            <div id="qrReader"></div>
        </div>


        <div
            id="cameraStatus"
            class="status"
        ></div>


        <!-- MANUAL FALLBACK -->

        <div class="manual-section">

            <div class="manual-label">
                CAMERA BEING DIFFICULT?
            </div>

            <input
                id="qrInput"
                class="qr-input"
                type="text"
                placeholder="PASTE QR DATA"
            >

            <button
                id="findMemberButton"
                class="find-button"
                type="button"
            >
                FIND MEMBER
            </button>

            <div
                id="lookupStatus"
                class="status"
            ></div>

        </div>

    </section>


    <!-- MEMBER CARD -->

    <section
        id="memberCard"
        class="member-card hidden"
    >

        <div class="member-label">
            MEMBER
        </div>

        <div
            id="customerName"
            class="customer-name"
        >
            —
        </div>

        <div
            id="customerPhone"
            class="customer-phone"
        >
            —
        </div>


        <div
            id="customerStampCount"
            class="stamp-count"
        >
            0
        </div>

        <div class="stamp-caption">
            CURRENT STAMPS
        </div>


        <button
            id="addStampButton"
            class="add-stamp-button"
            type="button"
        >
            + ADD STAMP
        </button>


        <div
            id="stampStatus"
            class="status"
        ></div>

    </section>


</section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://qlhvjveokciltwlebtbh.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_XKP8TdUHtlQfD18OMCs7dQ_w3IZAGqy";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   STATE
===================================================== */

let ACTIVE_MEMBER_ID = null;

let qrScanner = null;

let CAMERA_RUNNING = false;

let SCAN_LOCKED = false;


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const dashboardScreen =
    document.getElementById("dashboardScreen");

const emailInput =
    document.getElementById("emailInput");

const passwordInput =
    document.getElementById("passwordInput");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const staffName =
    document.getElementById("staffName");

const logoutButton =
    document.getElementById("logoutButton");

const openCameraButton =
    document.getElementById("openCameraButton");

const closeCameraButton =
    document.getElementById("closeCameraButton");

const cameraContainer =
    document.getElementById("cameraContainer");

const cameraStatus =
    document.getElementById("cameraStatus");

const qrInput =
    document.getElementById("qrInput");

const findMemberButton =
    document.getElementById("findMemberButton");

const lookupStatus =
    document.getElementById("lookupStatus");

const memberCard =
    document.getElementById("memberCard");

const customerName =
    document.getElementById("customerName");

const customerPhone =
    document.getElementById("customerPhone");

const customerStampCount =
    document.getElementById("customerStampCount");

const addStampButton =
    document.getElementById("addStampButton");

const stampStatus =
    document.getElementById("stampStatus");


/* =====================================================
   SCREEN CONTROL
===================================================== */

function showLogin() {

    loginScreen.classList.remove(
        "hidden"
    );

    dashboardScreen.classList.add(
        "hidden"
    );

}


function showDashboard() {

    loginScreen.classList.add(
        "hidden"
    );

    dashboardScreen.classList.remove(
        "hidden"
    );

}


/* =====================================================
   STAFF PROFILE
===================================================== */

async function loadStaff() {

    const {
        data: authData,
        error: authError
    } =
        await supabaseClient.auth.getUser();


    if (
        authError ||
        !authData?.user
    ) {

        console.error(
            "AUTH USER ERROR:",
            authError
        );

        return false;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("staff")
            .select(
                "name, outlet_id, role"
            )
            .eq(
                "user_id",
                authData.user.id
            )
            .maybeSingle();


    if (
        error ||
        !data
    ) {

        console.error(
            "STAFF PROFILE ERROR:",
            error
        );

        return false;

    }


    staffName.textContent =
        String(
            data.name ||
            "STAFF"
        ).toUpperCase();


    return true;

}


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    async function () {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (
            !email ||
            !password
        ) {

            loginStatus.textContent =
                "ENTER EMAIL + PASSWORD.";

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "LOGGING IN...";

        loginStatus.textContent =
            "";


        const {
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


        if (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );

            loginStatus.textContent =
                "LOGIN FAILED.";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "LOGIN";

            return;

        }


        const authorized =
            await loadStaff();


        if (!authorized) {

            await supabaseClient
                .auth
                .signOut();


            loginStatus.textContent =
                "NOT AUTHORIZED AS STAFF.";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "LOGIN";

            return;

        }


        loginStatus.textContent =
            "";


        showDashboard();


        window.scrollTo(
            0,
            0
        );


        loginButton.disabled =
            false;

        loginButton.textContent =
            "LOGIN";

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function () {

        await stopCamera();

        await supabaseClient.auth.signOut();

        ACTIVE_MEMBER_ID = null;

        memberCard.classList.add(
            "hidden"
        );

        emailInput.value = "";

        passwordInput.value = "";

        showLogin();

        window.scrollTo(
            0,
            0
        );

    }
);


/* =====================================================
   QR PARSER
===================================================== */

function parseQrData(rawText) {

    if (!rawText) {
        return null;
    }


    let text =
        String(
            rawText
        ).trim();


    try {

        text =
            decodeURIComponent(
                text
            );

    } catch (error) {
        /* already decoded */
    }


    try {

        const data =
            JSON.parse(
                text
            );


        if (
            data.type !==
            "vyne-club"
        ) {

            return null;

        }


        const memberId =
            Number(
                data.member_id
            );


        if (
            !Number.isFinite(
                memberId
            ) ||
            memberId <= 0
        ) {

            return null;

        }


        return {
            member_id:
                memberId
        };


    } catch (error) {

        return null;

    }

}


/* =====================================================
   LOAD CUSTOMER
===================================================== */

async function loadCustomer(
    memberId
) {

    lookupStatus.textContent =
        "LOOKING UP MEMBER...";


    memberCard.classList.add(
        "hidden"
    );


    const {
        data: member,
        error: memberError
    } =
        await supabaseClient
            .from("members")
            .select(
                "id, name, phone"
            )
            .eq(
                "id",
                memberId
            )
            .maybeSingle();


    if (
        memberError ||
        !member
    ) {

        console.error(
            "MEMBER LOOKUP ERROR:",
            memberError
        );

        lookupStatus.textContent =
            "MEMBER NOT FOUND.";

        return false;

    }


    const {
        data: stampData,
        error: stampError
    } =
        await supabaseClient
            .from("stamps")
            .select(
                "stamps"
            )
            .eq(
                "member_id",
                memberId
            )
            .maybeSingle();


    if (stampError) {

        console.error(
            "STAMP LOOKUP ERROR:",
            stampError
        );

    }


    ACTIVE_MEMBER_ID =
        Number(
            member.id
        );


    customerName.textContent =
        String(
            member.name ||
            "MEMBER"
        ).toUpperCase();


    customerPhone.textContent =
        member.phone ||
        "—";


    customerStampCount.textContent =
        String(
            Number(
                stampData?.stamps ||
                0
            )
        );


    lookupStatus.textContent =
        "";


    stampStatus.textContent =
        "";


    memberCard.classList.remove(
        "hidden"
    );


    setTimeout(
        function () {

            memberCard.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        },
        100
    );


    return true;

}


/* =====================================================
   CAMERA START
===================================================== */

async function startCamera() {

    if (CAMERA_RUNNING) {
        return;
    }


    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        cameraStatus.textContent =
            "SCANNER LIBRARY FAILED TO LOAD.";

        return;

    }


    SCAN_LOCKED = false;


    cameraStatus.textContent =
        "STARTING CAMERA...";


    openCameraButton.disabled =
        true;


    cameraContainer.classList.remove(
        "hidden"
    );


    closeCameraButton.classList.remove(
        "hidden"
    );


    try {

        qrScanner =
            new Html5Qrcode(
                "qrReader"
            );


        await qrScanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 230,
                    height: 230
                }
            },

            async function (
                decodedText
            ) {

                if (SCAN_LOCKED) {
                    return;
                }


                const parsed =
                    parseQrData(
                        decodedText
                    );


                if (!parsed) {

                    cameraStatus.textContent =
                        "NOT A VYNÉ CLUB QR.";

                    return;

                }


                SCAN_LOCKED = true;


                cameraStatus.textContent =
                    "QR DETECTED.";


                await stopCamera();


                const found =
                    await loadCustomer(
                        parsed.member_id
                    );


                if (!found) {

                    SCAN_LOCKED =
                        false;

                }

            },

            function () {
                /* scan misses are normal */
            }

        );


        CAMERA_RUNNING =
            true;


        cameraStatus.textContent =
            "POINT CAMERA AT MEMBER QR.";


    } catch (error) {

        console.error(
            "CAMERA START ERROR:",
            error
        );


        CAMERA_RUNNING =
            false;


        qrScanner =
            null;


        cameraContainer.classList.add(
            "hidden"
        );


        closeCameraButton.classList.add(
            "hidden"
        );


        openCameraButton.disabled =
            false;


        cameraStatus.textContent =
            "CAMERA ACCESS FAILED.";

    }

}


/* =====================================================
   CAMERA STOP
===================================================== */

async function stopCamera() {

    if (
        qrScanner &&
        CAMERA_RUNNING
    ) {

        try {

            await qrScanner.stop();

        } catch (error) {

            console.warn(
                "CAMERA STOP:",
                error
            );

        }

    }


    if (qrScanner) {

        try {

            qrScanner.clear();

        } catch (error) {
            /* ignore */
        }

    }


    qrScanner =
        null;


    CAMERA_RUNNING =
        false;


    cameraContainer.classList.add(
        "hidden"
    );


    closeCameraButton.classList.add(
        "hidden"
    );


    openCameraButton.disabled =
        false;

}


/* =====================================================
   CAMERA BUTTONS
===================================================== */

openCameraButton.addEventListener(
    "click",
    startCamera
);


closeCameraButton.addEventListener(
    "click",
    async function () {

        await stopCamera();

        cameraStatus.textContent =
            "";

    }
);


/* =====================================================
   MANUAL QR
===================================================== */

findMemberButton.addEventListener(
    "click",
    async function () {

        const parsed =
            parseQrData(
                qrInput.value
            );


        if (!parsed) {

            lookupStatus.textContent =
                "INVALID VYNÉ QR.";

            return;

        }


        await stopCamera();


        await loadCustomer(
            parsed.member_id
        );

    }
);


/* =====================================================
   ADD STAMP
===================================================== */

addStampButton.addEventListener(
    "click",
    async function () {

        if (!ACTIVE_MEMBER_ID) {

            stampStatus.textContent =
                "NO MEMBER SELECTED.";

            return;

        }


        addStampButton.disabled =
            true;


        addStampButton.textContent =
            "ADDING...";


        stampStatus.textContent =
            "";


        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "add_stamp",
                {
                    p_member_id:
                        ACTIVE_MEMBER_ID
                }
            );


        if (error) {

            console.error(
                "ADD STAMP ERROR:",
                error
            );


            stampStatus.textContent =
                "STAMP FAILED.";


            addStampButton.disabled =
                false;


            addStampButton.textContent =
                "+ ADD STAMP";


            return;

        }


        customerStampCount.textContent =
            String(
                Number(
                    data
                )
            );


        stampStatus.textContent =
            "STAMP ADDED.";


        addStampButton.disabled =
            false;


        addStampButton.textContent =
            "+ ADD STAMP";

    }
);


/* =====================================================
   INIT
===================================================== */

async function init() {

    loginScreen.classList.remove(
        "hidden"
    );

    dashboardScreen.classList.add(
        "hidden"
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .getSession();


    if (error) {

        console.error(
            "SESSION ERROR:",
            error
        );

        showLogin();

        return;

    }


    if (
        data?.session
    ) {

        const authorized =
            await loadStaff();


        if (authorized) {

            showDashboard();

            return;

        }


        await supabaseClient.auth
            .signOut();

    }


    showLogin();

}


init();

</script>
